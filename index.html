<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://kit.fontawesome.com/2abda0a511.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Metal&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomo - Premium Pomodoro Timer</title>
  <link rel="icon" type="image/x-icon" href="resources/images/favicon.ico">
  
  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <img src="resources/images/logo.png" alt="Logo">
    <h1>Pomo</h1>
  </header>

  <div id="timer"></div>

  <div class="controls">
    <button id="start-stop" onclick="playPause()" type="button">
     <i class="fa-solid fa-play"></i>
   </button>
    <button id="edit-time" type="button">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</main>
  <!-- JS File -->
  <script src="script.js"></script>
</body>

<footer>
  <p>Created by <a href="https://github.com/coleblakemanarmstrong/pomo">Cole Blakeman-Armstong</a></p>
</footer>
</html>
